<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Background job scheduling and retry flow</title>
  <desc id="desc">A sequence diagram showing a client submitting a delayed job to FastAPI, Redis, a Celery worker, MySQL, and a task handler, including success and retry paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .return { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .success { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; rx: 8; }
      .retry { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect width="1400" height="1040" fill="#ffffff" />
  <text x="700" y="42" text-anchor="middle" class="title">Background Job Scheduling and Retry Flow</text>

  <g>
    <rect x="55" y="76" width="150" height="42" class="box" /><text x="130" y="102" text-anchor="middle" class="label">Client</text>
    <rect x="300" y="76" width="180" height="42" class="box" /><text x="390" y="102" text-anchor="middle" class="label">FastAPI API</text>
    <rect x="570" y="76" width="150" height="42" class="box" /><text x="645" y="102" text-anchor="middle" class="label">MySQL</text>
    <rect x="810" y="76" width="150" height="42" class="box" /><text x="885" y="102" text-anchor="middle" class="label">Redis</text>
    <rect x="1050" y="76" width="180" height="42" class="box" /><text x="1140" y="102" text-anchor="middle" class="label">Celery Worker</text>
    <rect x="1280" y="76" width="90" height="42" class="box" /><text x="1325" y="102" text-anchor="middle" class="label">Handler</text>
  </g>

  <g class="line">
    <path d="M130 118 V980" /><path d="M390 118 V980" /><path d="M645 118 V980" />
    <path d="M885 118 V980" /><path d="M1140 118 V980" /><path d="M1325 118 V980" />
  </g>

  <g class="text">
    <line x1="130" y1="160" x2="390" y2="160" class="arrow" /><text x="260" y="150" text-anchor="middle">POST /jobs</text>
    <line x1="390" y1="205" x2="645" y2="205" class="arrow" /><text x="518" y="195" text-anchor="middle">Insert QUEUED job</text>
    <line x1="645" y1="250" x2="390" y2="250" class="return" /><text x="518" y="240" text-anchor="middle">job_id committed</text>
    <line x1="390" y1="295" x2="885" y2="295" class="arrow" /><text x="638" y="285" text-anchor="middle">apply_async(countdown)</text>
    <line x1="390" y1="340" x2="130" y2="340" class="return" /><text x="260" y="330" text-anchor="middle">202 + job_id</text>

    <rect x="765" y="370" width="240" height="58" class="box" /><text x="885" y="395" text-anchor="middle">Wait for countdown</text><text x="885" y="415" text-anchor="middle" class="small">job remains QUEUED</text>
    <line x1="885" y1="455" x2="1140" y2="455" class="arrow" /><text x="1012" y="445" text-anchor="middle">Deliver scheduled task</text>
    <line x1="1140" y1="500" x2="645" y2="500" class="arrow" /><text x="892" y="490" text-anchor="middle">Read job, create attempt</text>
    <line x1="1140" y1="545" x2="645" y2="545" class="arrow" /><text x="892" y="535" text-anchor="middle">Set PROCESSING</text>
    <line x1="1140" y1="590" x2="1325" y2="590" class="arrow" /><text x="1232" y="580" text-anchor="middle">Execute handler</text>

    <rect x="1030" y="630" width="220" height="92" class="success" /><text x="1140" y="655" text-anchor="middle" class="label">Success</text><text x="1140" y="678" text-anchor="middle" class="small">Save result</text><text x="1140" y="699" text-anchor="middle" class="small">Job COMPLETED</text>
    <line x1="1140" y1="740" x2="645" y2="740" class="arrow" /><text x="892" y="730" text-anchor="middle">Commit result and attempt</text>

    <rect x="745" y="780" width="280" height="110" class="retry" /><text x="885" y="805" text-anchor="middle" class="label">Failure</text><text x="885" y="828" text-anchor="middle" class="small">Attempt FAILED</text><text x="885" y="850" text-anchor="middle" class="small">Job RETRY if attempts remain</text><text x="885" y="872" text-anchor="middle" class="small">Celery schedules backoff</text>
    <path d="M1140 630 C1140 760 1050 825 1025 825" class="arrow" fill="none" />
    <path d="M745 880 C620 950 1110 950 1110 890" class="return" fill="none" /><text x="875" y="940" text-anchor="middle">Retry after countdown, or FAILED at max attempts</text>
  </g>

  <g class="text">
    <line x1="130" y1="980" x2="390" y2="980" class="arrow" /><text x="260" y="970" text-anchor="middle">GET /jobs/{job_id}</text>
    <line x1="390" y1="1015" x2="645" y2="1015" class="arrow" /><text x="518" y="1005" text-anchor="middle">Read status and result</text>
  </g>
</svg>
