services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: jobProcess
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    command: celery -A workers.celery_app worker -l INFO -P prefork -c 2
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: mysql+pymysql://root:admin123@mysql:3306/jobProcess
      CELERY_RESULT_BACKEND: db+mysql+pymysql://root:admin123@mysql:3306/jobProcess
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
